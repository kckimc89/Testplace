<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>경복궁2 사진 28장 검사</title><style>body{margin:0;background:#0b1722;color:white;font:18px system-ui,-apple-system,sans-serif}header{padding:18px;background:#1c364a;position:sticky;top:0}h1{font-size:24px;margin:0 0 8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row button{padding:12px;font-size:17px;border-radius:10px}.main{padding:12px;max-width:1100px;margin:auto}.hero{width:100%;height:min(75vh,750px);object-fit:contain;background:#000;border-radius:15px}.small{opacity:.8;font-size:15px}.thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:7px;margin:15px 0}.thumbs button{border:3px solid transparent;border-radius:6px;padding:0;background:#243747;cursor:pointer}.thumbs button.active{border-color:#fbbf5a}.thumbs img{width:100%;height:78px;object-fit:cover}a{color:#fcd779}</style></head><body><header><h1>🏯 경복궁2 · WebP 800/Q40 사진 28장 확인</h1><div class="row"><button id="prev">◀ 이전</button><b id="count">1 / 28</b><button id="next">다음 ▶</button><a href="index.html">명소대백과로 이동</a></div><div class="small">이 화면의 28장은 파일 안에 내장되어 있어 사진 폴더 경로와 무관하게 표시됩니다. 외부 링크 3장은 제외했습니다.</div></header><div class="main"><img class="hero" id="hero" alt="경복궁 WebP 사진"><p id="desc"></p><div id="thumbs" class="thumbs"></div></div><script src="trial-photo-data.js"></script><script>const names=Object.keys(window.GB2_INLINE_WEBP||{}).sort(), cache={};let i=0;function src(n){if(!cache[n])cache[n]='data:image/webp;base64,'+window.GB2_INLINE_WEBP[n];return cache[n];}function draw(){let n=names[i];document.getElementById('hero').src=src(n);document.getElementById('count').textContent=(i+1)+' / '+names.length;document.getElementById('desc').textContent=n+' · WebP 800/Q40 · 약 '+(window.GB2_INLINE_WEBP[n].length*3/4/1024).toFixed(1)+' KB';document.querySelectorAll('.thumbs button').forEach((b,k)=>b.classList.toggle('active',k===i));}document.getElementById('thumbs').innerHTML=names.map((n,k)=>'<button data-i="'+k+'"><img loading="lazy" src="'+src(n)+'" alt="'+n+'"></button>').join('');document.querySelectorAll('.thumbs button').forEach(b=>b.onclick=()=>{i=+b.dataset.i;draw();});document.getElementById('prev').onclick=()=>{i=(i-1+names.length)%names.length;draw()};document.getElementById('next').onclick=()=>{i=(i+1)%names.length;draw()};draw();</script></body></html>
